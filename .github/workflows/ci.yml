name: CI Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (production deps)
        run: pnpm audit --prod

      - name: Prettier check
        run: pnpm run format:check:md

      - name: ESLint
        run: pnpm run lint

      - name: Astro check
        run: pnpm run check

      - name: Build test
        run: pnpm run build
